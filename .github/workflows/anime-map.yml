# Раз в неделю пересобирает карту Shikimori/MyAnimeList ↔ TMDB для anime.js из Fribb/anime-lists
name: anime-map
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_anime_map.py
      - run: |
          git config user.name "anime-map bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anime-map
          git diff --cached --quiet || (git commit -m "Update the anime map" && git push)
